<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Qari Tilawat Studio - Branding Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #050b14, #0f172a, #1e293b);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            color: #d4af37;
            font-size: 24px;
        }
        .brand-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        textarea {
            width: 100%;
            height: 130px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #d4af37;
            border-radius: 10px;
            color: #fff;
            padding: 15px;
            font-size: 18px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            text-align: right;
            line-height: 1.6;
        }
        textarea::placeholder {
            color: #64748b;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
        }
        button:hover {
            background: #eab308;
        }
        button.secondary {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
        }
        button.secondary:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
            min-height: 20px;
        }
        audio {
            width: 100%;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Qari Studio</h2>
        <div class="brand-subtitle">PRO PROFESSIONAL QIRAT GENERATOR</div>
        
        <textarea id="arabicText" placeholder="Yahan Surah ya Ayat likhein (Misal: بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ)..."></textarea>
        
        <div class="btn-group">
            <button onclick="playTilawat()">Tilawat Suniye</button>
            <button class="secondary" id="downloadBtn" onclick="downloadAudio()" style="display:none;">Download Audio</button>
        </div>

        <div class="status" id="statusText"></div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let currentUtterance = null;

        function playTilawat() {
            let text = document.getElementById("arabicText").value;
            let status = document.getElementById("statusText");
            let downloadBtn = document.getElementById("downloadBtn");

            if (text.trim() === "") {
                status.innerText = "Pehle kuch Arabic text darj karein!";
                return;
            }

            if (synth.speaking) {
                synth.cancel();
            }

            let utterance = new SpeechSynthesisUtterance(text);
            let voices = synth.getVoices();
            
            // Male deep Arabic voice filter karne ki koshish
            let qariVoice = voices.find(v => (v.lang.includes('ar') || v.lang.includes('AR')) && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('saudi') || v.name.toLowerCase().includes('rashid') || v.name.toLowerCase().includes('naif')));
            
            if (!qariVoice) {
                qariVoice = voices.find(v => v.lang.startsWith('ar') || v.lang.includes('ar-'));
            }

            if (qariVoice) {
                utterance.voice = qariVoice;
            }

            utterance.lang = 'ar-SA';
            utterance.rate = 0.75; // Qirat jaisi halki raftar taaki dard aur thumak mehsoos ho
            utterance.pitch = 0.8;  // Pitch low ki hai taaki Qari jaisi bhari aur roohani male voice lage

            utterance.onstart = function() {
                status.innerText = "Roohani Tilawat taiyar ho rahi hai...";
                downloadBtn.style.display = "none";
            }

            utterance.onend = function() {
                status.innerText = "Tilawat mukammal ho gayi hai!";
                // Note: Browser ki Web Speech API direct audio blob export nahi karti, 
                // isliye pure Qari level ke export ke liye backend par ElevenLabs API lagana parti hai.
            }

            utterance.onerror = function() {
                status.innerText = "Voice generation mein koi kharabi aayi hai.";
            }

            synth.speak(utterance);
        }
    </script>
</body>
</html>
