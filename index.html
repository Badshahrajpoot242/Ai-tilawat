<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Qari Tilawat Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #070b12, #111827, #1f2937);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            color: #d4af37;
            font-size: 26px;
        }
        .brand {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        textarea {
            width: 100%;
            height: 130px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            border-radius: 12px;
            color: #fff;
            padding: 15px;
            font-size: 19px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            text-align: right;
            line-height: 1.6;
        }
        textarea::placeholder {
            color: #6b7280;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
        }
        button:hover {
            background: #eab308;
        }
        button.download-btn {
            background: #059669;
            color: #fff;
            display: none;
        }
        button.download-btn:hover {
            background: #10b981;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
            min-height: 25px;
        }
        audio {
            width: 100%;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Qari Studio</h2>
        <div class="brand">EXCLUSIVELY MALE QIRAT GENERATOR</div>
        
        <textarea id="arabicText" placeholder="Yahan Arabic text likhein (Misal: بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ)..."></textarea>
        
        <div class="btn-group">
            <button id="generateBtn" onclick="generateTilawat()">Tilawat Banayein</button>
            <button id="downloadBtn" class="download-btn" onclick="downloadAudio()">Download Audio</button>
        </div>

        <div class="status" id="statusText"></div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let audioBlobUrl = null;

        async function generateTilawat() {
            let text = document.getElementById("arabicText").value;
            let status = document.getElementById("statusText");
            let audioPlayer = document.getElementById("audioPlayer");
            let downloadBtn = document.getElementById("downloadBtn");
            let generateBtn = document.getElementById("generateBtn");

            if (text.trim() === "") {
                status.innerText = "Pehle kuch Arabic text likhein!";
                return;
            }

            status.innerText = "Male Qari AI aawaz taiyar kar raha hai...";
            generateBtn.disabled = true;
            audioPlayer.style.display = "none";
            downloadBtn.style.display = "none";

            try {
                // ElevenLabs API ka istemal jo deep male Arabic voice deta hai
                // Note: Iske liye apni ElevenLabs API Key yahan lagani hogi
                const apiKey = "YOUR_ELEVENLABS_API_KEY"; 
                // (Agar aapke paas API key nahi hai, toh aap ElevenLabs par free account bana kar apni API key yahan paste kar dena)
                const voiceId = "EXAVITQu4vr4xnSDxMaL"; // Deep Male Voice ID

                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'audio/mpeg',
                        'Content-Type': 'application/json',
                        'xi-api-key': apiKey
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: {
                            stability: 0.75,
                            similarity_boost: 0.85,
                            style: 0.4,
                            use_speaker_boost: true
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error("API Connection Failed. Please check API Key.");
                }

                const blob = await response.blob();
                audioBlobUrl = URL.createObjectURL(blob);

                audioPlayer.src = audioBlobUrl;
                audioPlayer.style.display = "block";
                downloadBtn.style.display = "block";
                status.innerText = "Tilawat mukammal ho gayi hai!";
                audioPlayer.play();

            } catch (error) {
                status.innerText = "Error: API Key lagana lazmi hai ya internet check karein.";
            } finally {
                generateBtn.disabled = false;
            }
        }

        function downloadAudio() {
            if (audioBlobUrl) {
                let a = document.createElement('a');
                a.href = audioBlobUrl;
                a.download = 'AI-Tilawat-Qari.mp3';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }
    </script>
</body>
</html>
